{{extend defaultLayout}}
{{block 'css'}}
<style>
    /* 二维码合成卡片：以 furina-qr-code.png 为底图，二维码叠加到指定坐标 */
    .container {
        width: 936px !important;
        padding: 0 !important;
        margin: 0;
        background: none;
    }
    .qr-card {
        position: relative;
        width: 936px;
        height: 1024px;
        background-image: url('{{_res_path}}/qrCode/furina-qr-code.png');
        background-size: 936px 1024px;
        background-repeat: no-repeat;
    }
    /* 二维码外接矩形左上角位于背景图 (100, 185)，尺寸 500x500 */
    .qr-box {
        position: absolute;
        left: 100px;
        top: 185px;
        width: 500px;
        height: 500px;
    }
    .qr-box table {
        border-collapse: collapse;
    }
    /* 免责声明已烧录在背景图中，隐藏布局自带的版权条避免底部多出一条 */
    .copyright {
        display: none !important;
    }
</style>
{{/block}}
{{block 'main'}}
<div class="qr-card">
    <div class="qr-box" id="qrbox"></div>
</div>
<script src="{{_res_path}}/qrCode/js/jquery-1.10.2.min.js"></script>
<script src="{{_res_path}}/qrCode/js/jquery.qrcode.min.js"></script>
<script>
var config = {
    width:500,//值是number类型, 表示的单位是px 必须传递
    height:500,//值是number类型, 表示的单位是px 必须传递
    text:"{{url}}".replace(/#38;/g,''),//text就表示二维码中存储的数据 必须传递
    correctLevel:2,//取值为0|1|2|3 表示二维码的纠错级别0:L/1:M/2:Q/3:H ,默认0 可选参数
    render:"table"//取值:table/canvas , 默认table 可选参数
};
$("#qrbox").qrcode(config);
</script>
{{/block}}
